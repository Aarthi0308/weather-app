<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>🌤️ Weather Forecast</h1>
        <p class="subtitle">Check the weather in your city</p>

        <div class="search-box">
            <input type="text" id="cityInput"
                placeholder="Enter city name...">
            <button id="searchBtn">Search</button>
        </div>

        <p id="message"></p>

        <div id="weatherInfo" class="hidden">

            <div class="current-weather">
                <h2 id="cityName"></h2>
                <h1 id="temperature"></h1>
                <h3 id="description"></h3>

                <div class="details">
                    <p>💧 Humidity: <span id="humidity"></span>%</p>
                    <p>💨 Wind Speed: <span id="wind"></span> km/h</p>
                    <p>🌡️ Feels Like: <span id="feelsLike"></span>°C</p>
                </div>
            </div>

            <h2>5-Day Forecast</h2>

            <div id="forecast" class="forecast-container"></div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
